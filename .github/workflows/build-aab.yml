name: Build Google Play AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application Display Name'
        required: true
        default: 'HTML Game'
      package_id:
        description: 'Android Package ID'
        required: true
        default: 'com.erik.mygame'
      version_code:
        description: 'Version Code Integer'
        required: true
        default: '1'
      version_name:
        description: 'Version Name String'
        required: true
        default: '1.0.0'
      html_base64:
        description: 'Web Asset Payload (Optional when committed directly)'
        required: false
        default: 'STAGED_IN_REPO'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.2
        run: |
          curl -sLO https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Scaffold Android WebView Project
        run: |
          python3 - << 'PYEOF'
          import os, base64

          os.makedirs("app/src/main/java/com/template/app", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-hdpi", exist_ok=True)
          os.makedirs("app/src/main/assets/web", exist_ok=True)

          with open("build.gradle", "w", encoding="utf-8") as f:
              f.write("""buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          """)

          with open("settings.gradle", "w", encoding="utf-8") as f:
              f.write("rootProject.name = \"html2aab-app\"
include \":app\"
")

          with open("gradle.properties", "w", encoding="utf-8") as f:
              f.write("org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=false
")

          with open("app/build.gradle", "w", encoding="utf-8") as f:
              f.write("""plugins {
              id "com.android.application"
          }
          android {
              namespace "com.template.app"
              compileSdk 34
              defaultConfig {
                  applicationId project.findProperty("android.defaultConfig.applicationId") ?: "com.template.app"
                  minSdk 24
                  targetSdk 34
                  versionCode (project.findProperty("android.defaultConfig.versionCode") ?: "1").toInteger()
                  versionName project.findProperty("android.defaultConfig.versionName") ?: "1.0.0"
              }
              signingConfigs {
                  release {
                      def ksPath = System.getenv("KEYSTORE_PATH") ?: "../release.keystore"
                      def ksFile = file(ksPath).isAbsolute() ? file(ksPath) : rootProject.file(ksPath.replaceFirst("^\.\./", ""))
                      if (ksFile.exists()) {
                          storeFile ksFile
                          storePassword System.getenv("KEYSTORE_PASSWORD") ?: "storepass123"
                          keyAlias System.getenv("KEY_ALIAS") ?: "upload"
                          keyPassword System.getenv("KEY_PASSWORD") ?: "storepass123"
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                          signingConfig signingConfigs.release
                      }
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.webkit:webkit:1.10.0"
          }
          """)

          with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.HTMLApp">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)

          with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write("<resources><string name=\"app_name\">App</string></resources>
")

          with open("app/src/main/res/values/styles.xml", "w", encoding="utf-8") as f:
              f.write("""<resources>
              <style name="Theme.HTMLApp" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">false</item>
              </style>
          </resources>
          """)

          with open("app/src/main/res/mipmap-hdpi/ic_launcher.png", "wb") as f:
              f.write(base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAALklEQVR42u3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABuBn4AAAF94hG6AAAAAElFTkSuQmCC"))

          with open("app/src/main/java/com/template/app/MainActivity.java", "w", encoding="utf-8") as f:
              f.write("""package com.template.app;
          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();
                  webView.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });
                  webView.loadUrl("https://appassets.androidplatform.net/assets/web/index.html");
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """)
          print("Android project scaffold written successfully.")
          PYEOF

      - name: Stage Web Assets
        run: |
          if [ -f uploaded_asset.bin ]; then
            if file uploaded_asset.bin | grep -q "Zip archive"; then
              unzip -o uploaded_asset.bin -d app/src/main/assets/web/
            else
              cp uploaded_asset.bin app/src/main/assets/web/index.html
            fi
          elif [ -n "${{ github.event.inputs.html_base64 }}" ] && [ "${{ github.event.inputs.html_base64 }}" != "STAGED_IN_REPO" ]; then
            echo "${{ github.event.inputs.html_base64 }}" | base64 --decode > uploaded_asset.bin
            if file uploaded_asset.bin | grep -q "Zip archive"; then
              unzip -o uploaded_asset.bin -d app/src/main/assets/web/
            else
              cp uploaded_asset.bin app/src/main/assets/web/index.html
            fi
          elif [ -f index.html ]; then
            cp index.html app/src/main/assets/web/index.html
          fi

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v             -keystore release.keystore             -alias upload             -keyalg RSA -keysize 2048             -validity 10000             -storepass storepass123             -keypass storepass123             -dname "CN=Publisher, OU=Mobile, O=Creator, L=City, ST=State, C=US"

      - name: Build Signed Android App Bundle (.aab)
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: storepass123
          KEY_ALIAS: upload
          KEY_PASSWORD: storepass123
        run: |
          gradle bundleRelease --no-daemon             -Pandroid.defaultConfig.applicationId="${{ github.event.inputs.package_id }}"             -Pandroid.defaultConfig.versionCode=${{ github.event.inputs.version_code }}             -Pandroid.defaultConfig.versionName="${{ github.event.inputs.version_name }}"

      - name: Upload Signed Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/*.aab
name: Build Google Play AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application Display Name'
        required: true
        default: 'HTML Game'
      package_id:
        description: 'Android Package ID'
        required: true
        default: 'com.erik.mygame'
      version_code:
        description: 'Version Code Integer'
        required: true
        default: '1'
      version_name:
        description: 'Version Name String'
        required: true
        default: '1.0.0'
      html_base64:
        description: 'Web Asset Payload'
        required: false
        default: 'STAGED_IN_REPO'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.2
        run: |
          curl -sLO https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Scaffold Android WebView Project & SDK Licenses
        env:
          INPUT_APP_NAME: ${{ github.event.inputs.app_name }}
          INPUT_PACKAGE_ID: ${{ github.event.inputs.package_id }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          echo "" | base64 --decode | python3
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Stage Web Assets
        run: |
          if [ -f uploaded_asset.bin ]; then
            if file uploaded_asset.bin | grep -qi "Zip archive"; then
              unzip -o uploaded_asset.bin -d app/src/main/assets/web/
            else
              cp uploaded_asset.bin app/src/main/assets/web/index.html
            fi
          elif [ -n "${{ github.event.inputs.html_base64 }}" ] && [ "${{ github.event.inputs.html_base64 }}" != "STAGED_IN_REPO" ]; then
            echo "${{ github.event.inputs.html_base64 }}" | base64 --decode > uploaded_asset.bin
            if file uploaded_asset.bin | grep -qi "Zip archive"; then
              unzip -o uploaded_asset.bin -d app/src/main/assets/web/
            else
              cp uploaded_asset.bin app/src/main/assets/web/index.html
            fi
          elif [ -f index.html ]; then
            cp index.html app/src/main/assets/web/index.html
          fi
          ls -lh app/src/main/assets/web/

      - name: Generate or Reuse Persistent Keystore (.jks) & Export .PEM
        run: |
          mkdir -p signing
          if [ -f signing/release-key.jks ]; then
            echo "Reusing existing persistent upload keystore from repository (signing/release-key.jks)..."
            cp signing/release-key.jks release.keystore
            cp signing/release-key.jks release-key.jks
          elif [ -f release.keystore ]; then
            cp release.keystore release-key.jks
            cp release.keystore signing/release-key.jks
          else
            echo "Generating new 2048-bit RSA Upload Keystore (release-key.jks)..."
            keytool -genkeypair -v -noprompt \
              -keystore release-key.jks \
              -alias upload \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass storepass123 \
              -keypass storepass123 \
              -dname "CN=Publisher, OU=Mobile, O=Creator, L=City, ST=State, C=US"
            cp release-key.jks release.keystore
            cp release-key.jks signing/release-key.jks
          fi
          echo "Exporting RFC-compliant upload_certificate.pem for Google Play Key Reset..."
          keytool -export -rfc \
            -keystore release-key.jks \
            -alias upload \
            -file upload_certificate.pem \
            -storepass storepass123
          cp upload_certificate.pem signing/upload_certificate.pem
          git config user.name "PlayBundle Studio Bot"
          git config user.email "bot@playbundlestudio.local"
          git add signing/release-key.jks signing/upload_certificate.pem
          if ! git diff --cached --quiet; then
            git commit -m "Persist official Google Play upload keystore (.jks) and reset certificate (.pem)" || true
            git push || true
          fi
          echo "=== PlayBundle Studio Upload Keystore (.jks & .pem) Details ===" > keystore-info.txt
          echo "Keystore File: release-key.jks" >> keystore-info.txt
          echo "PEM Certificate (For Google Play Key Reset): upload_certificate.pem" >> keystore-info.txt
          echo "Keystore Password: storepass123" >> keystore-info.txt
          echo "Key Alias: upload" >> keystore-info.txt
          echo "Key Password: storepass123" >> keystore-info.txt
          echo "" >> keystore-info.txt
          echo "=== Certificate Fingerprints (SHA-1 & SHA-256) ===" >> keystore-info.txt
          keytool -list -v -keystore release-key.jks -storepass storepass123 >> keystore-info.txt || true

      - name: Build Signed Android App Bundle (.aab)
        run: |
          gradle bundleRelease --no-daemon --stacktrace

      - name: Stage Final Output Files (.aab + .jks + .pem + credentials)
        run: |
          mkdir -p bundle-output
          cp app/build/outputs/bundle/release/*.aab bundle-output/
          cp release-key.jks bundle-output/release-key.jks
          cp upload_certificate.pem bundle-output/upload_certificate.pem
          cp keystore-info.txt bundle-output/keystore-info.txt
          ls -lh bundle-output/

      - name: Upload Signed Bundle & Keystore (.jks) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-and-keystore
          path: bundle-output/*
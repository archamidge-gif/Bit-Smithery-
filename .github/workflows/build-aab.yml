name: Build Google Play AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application Display Name'
        required: true
        default: 'HTML Game'
      package_id:
        description: 'Android Package ID'
        required: true
        default: 'com.erik.mygame'
      version_code:
        description: 'Version Code Integer'
        required: true
        default: '1'
      version_name:
        description: 'Version Name String'
        required: true
        default: '1.0.0'
      html_base64:
        description: 'Web Asset Payload'
        required: false
        default: 'STAGED_IN_REPO'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.2
        run: |
          curl -sLO https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "
84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Scaffold Android WebView Project
        run: |
          echo "" | base64 --decode | python3

      - name: Stage Web Assets
        run: |
          if [ -f uploaded_asset.bin ]; then
            if file uploaded_asset.bin | grep -q "Zip archive"; then
              unzip -o uploaded_asset.bin -d app/src/main/assets/web/
            else
              cp uploaded_asset.bin app/src/main/assets/web/index.html
            fi
          elif [ -n "${{ github.event.inputs.html_base64 }}" ] && [ "${{ github.event.inputs.html_base64 }}" != "STAGED_IN_REPO" ]; then
            echo "${{ github.event.inputs.html_base64 }}" | base64 --decode > uploaded_asset.bin
            if file uploaded_asset.bin | grep -q "Zip archive"; then
              unzip -o uploaded_asset.bin -d app/src/main/assets/web/
            else
              cp uploaded_asset.bin app/src/main/assets/web/index.html
            fi
          elif [ -f index.html ]; then
            cp index.html app/src/main/assets/web/index.html
          fi

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias upload \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass storepass123 \
            -keypass storepass123 \
            -dname "CN=Publisher, OU=Mobile, O=Creator, L=City, ST=State, C=US"

      - name: Build Signed Android App Bundle (.aab)
        run: |
          gradle bundleRelease --no-daemon --stacktrace \
            -Pandroid.defaultConfig.applicationId="${{ github.event.inputs.package_id }}" \
            -Pandroid.defaultConfig.versionCode=${{ github.event.inputs.version_code }} \
            -Pandroid.defaultConfig.versionName="${{ github.event.inputs.version_name }}"

      - name: Upload Signed Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/*.aab